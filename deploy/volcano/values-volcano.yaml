# =============================================================================
# Volcano batch scheduler v1.15.4 - REQUIRED for NeMo Customizer (NeMo 25.8)
# The NeMo Operator submits every fine-tuning job as a Volcano Job; the only other
# supported backend is Run:ai. Installed as its OWN Helm release, straight from the
# Volcano Helm repo, BEFORE the flywheel (RUNBOOK 1.2). CLUSTER-SCOPED: needs approval A1.
#
# Why 1.15.4 and not the 1.9.0 bundled in NeMo 25.8: the client runs OpenShift 4.22
# (Kubernetes 1.35). Volcano's compatibility matrix supports Kubernetes 1.35 from v1.15;
# v1.9 was only tested up to ~1.29. NeMo uses Volcano's stable APIs
# (batch.volcano.sh/v1alpha1 Job, scheduling.volcano.sh/v1beta1 PodGroup/Queue),
# unchanged since 1.9. This pairing (NeMo 25.8 + Volcano 1.15) is NOT tested by NVIDIA.
#
# Kept minimal for a production cluster:
#   - admission webhooks OFF: no webhook can ever block pod/job creation anywhere.
#     (With NVIDIA's default layout the webhooks skip the release namespace anyway,
#      i.e. NeMo's own jobs were never sent through them.)
#   - only controller + scheduler run (2 pods in nvaie-test); the scheduler only places
#     pods that ask for schedulerName: volcano.
#   - restricted-v2 compatible: no fixed UID, no added capabilities, no fixed SELinux level.
#   - priorityClassName system-cluster-critical removed by deploy/scripts/volcano-postrender.sh
#     (it would let our test pods pre-empt production pods).
# Leaves behind after `helm uninstall volcano`: the runtime Queues "default"/"root"
# (deleted explicitly in RUNBOOK 1.8).
# =============================================================================
basic:
  image_pull_policy: IfNotPresent
custom:
  admission_enable: false
  metrics_enable: false
  controller_metrics_enable: false
  scheduler_metrics_enable: false
  leader_elect_enable: false
  default_sc:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
    seLinuxOptions: null
  default_csc:
    runAsNonRoot: true
    runAsUser: null
    allowPrivilegeEscalation: false
    capabilities:
      add: null
      drop: ["ALL"]
  controller_resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits:   {cpu: "1",  memory: 1Gi}
  scheduler_resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits:   {cpu: "1",  memory: 1Gi}
