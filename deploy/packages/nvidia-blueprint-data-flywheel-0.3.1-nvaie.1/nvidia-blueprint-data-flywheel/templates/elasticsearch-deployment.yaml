---
{{- if .Values.elasticsearch.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.elasticsearch.fullnameOverride }}-deployment
  labels:
    app: {{ .Values.elasticsearch.fullnameOverride }}-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.elasticsearch.fullnameOverride }}-deployment
  template:
    metadata:
      labels:
        app: {{ .Values.elasticsearch.fullnameOverride }}-deployment
        {{- include "df.podLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "df.podSpecExtras" . | nindent 6 }}
      containers:
        - name: elasticsearch
          image: "{{ .Values.elasticsearch.image.repository }}:{{ .Values.elasticsearch.image.tag }}"
          imagePullPolicy: Always
          {{- include "df.containerSecurityContext" . | nindent 10 }}
          resources:
            {{- toYaml .Values.elasticsearch.resources | nindent 12 }}
          ports:
            - containerPort: {{ .Values.elasticsearch.service.port }}
          env:
            {{- range $key, $val := .Values.elasticsearch.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          {{- /* PATCH(nvaie): writable emptyDir data dirs so a random restricted-v2 UID can write */}}
          {{- with .Values.elasticsearch.dataDirs }}
          volumeMounts:
            {{- range $i, $p := . }}
            - name: data-{{ $i }}
              mountPath: {{ $p }}
            {{- end }}
      volumes:
            {{- range $i, $p := . }}
        - name: data-{{ $i }}
          emptyDir: {}
            {{- end }}
          {{- end }}
{{- end }}
