# =============================================================================
# Data Flywheel Blueprint v0.3.1 (NeMo Microservices 25.8.0) - nvaie-test overrides
# Barebones: only what the flywheel needs to run one job with NeMo Evaluator + Customizer.
#
# Use together with ONE layout file:
#   -f values-nvaie-common.yaml -f values-layout-l40s.yaml   (fallback, all 3 GPUs on L40S)
#   -f values-nvaie-common.yaml -f values-layout-h200.yaml   (Customizer on H200)
#
# Chart: deploy/flywheel/chart (patched copy, see deploy/flywheel/PATCHES.md)
#
# GPU budget at runtime (nothing in this chart requests a GPU directly):
#   1 x candidate NIM  meta/llama-3.2-1b-instruct  (created by deployment-management)
#   1 x judge NIM      meta/llama-3.1-8b-instruct  (created by deployment-management)
#   1 x Customizer LoRA training pod               (created by NeMo Operator via Volcano)
#   = 3 GPUs peak. The embedding NIM is NOT started (icl example_selection=uniform).
#
# CONFIGURABLE ITEMS (search for "CONFIG:"):
#   namespace, StorageClass, Kueue queue label, nodeSelectors, judge NIM tag,
#   (bundled NIM Operator is not used).
# =============================================================================

# CONFIG: namespace. Must match `helm install -n <ns>`; also used for RBAC scoping below.
namespace: nvaie-test

# --- Secrets are pre-created by the runbook (oc create secret ...), never by Helm ----
secrets:
  create: false
  optionalSecretRefs: true     # API-key secrets the app references (nvidia-api, hf-secret, ...) are not needed with a local judge
ngcApiSecret:   {name: ngc-api,       key: NGC_API_KEY}
nvidiaApiSecret: {name: nvidia-api,   key: NVIDIA_API_KEY}
hfSecret:       {name: hf-secret,     key: HF_TOKEN}
llmJudgeSecret: {name: llm-judge-api, key: LLM_JUDGE_API_KEY}
embSecret:      {name: emb-api,       key: EMB_API_KEY}
imagePullSecrets: []           # the chart must not create a pull secret

# CONFIG: Kueue. Empty = no label. Example: queueName: "default-lq" (a LocalQueue in nvaie-test).
# Only applies to pods rendered by this chart; NIM and training pods created at runtime
# by NeMo cannot carry it (see RUNBOOK "Kueue").
kueue:
  queueName: ""

# Restricted-v2 friendly settings for the flywheel's own pods. No fixed UID/GID/fsGroup:
# the SCC assigns them from the namespace range (and fsGroup makes volumes writable).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile: {type: RuntimeDefault}
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities: {drop: ["ALL"]}
cpuNodeSelector: {}            # CONFIG: optional placement of CPU pods (empty = anywhere)

# --- Barebones: production profile (no Kibana, no Flower) and no MLflow ----------
profile:
  production: {enabled: true}
  mlflow: {COMPOSE_PROFILES: ""}
volcano: {enabled: false}      # unused key of this chart; Volcano is installed separately (cluster-scoped, needs approval)

# --- In-cluster NeMo API router (CPU only, replaces the upstream Ingress) --------
nemoGateway:
  enabled: true
  image: "registry.redhat.io/ubi9/nginx-126:1-1777855212"
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

# --- Infra for the flywheel (ephemeral, emptyDir only; test data is reloaded per run) ---
elasticsearch:
  service: {type: ClusterIP, port: 9200}
  dataDirs: [/usr/share/elasticsearch/data]
  resources:
    requests: {cpu: 500m, memory: 2Gi, ephemeral-storage: 1Gi}
    limits:   {cpu: "2",  memory: 3Gi, ephemeral-storage: 5Gi}
mongodb:
  image: {repository: mongo, tag: "7.0.14"}           # upstream: mongo:7.0 (floating) -> pinned patch release
  service: {type: ClusterIP, port: 27017}
  dataDirs: [/data/db, /data/configdb]
  resources:
    requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 1Gi}
    limits:   {cpu: "1",  memory: 2Gi,   ephemeral-storage: 5Gi}
redis:
  image: {repository: redis, tag: "7.2.5-alpine"}     # upstream: redis:7.2-alpine (floating) -> pinned
  service: {type: ClusterIP, port: 6379}
  dataDirs: [/data]
  resources:
    requests: {cpu: 250m, memory: 256Mi, ephemeral-storage: 1Gi}
    limits:   {cpu: "1",  memory: 1Gi,   ephemeral-storage: 2Gi}

foundationalFlywheelServer:
  imagePullSecrets:
    - name: ngc-registry-default
  initDataFolder: false        # drop busybox:1.28 init container (docker.io, not needed)
  # The image runs as root upstream and was built with `uv sync --no-dev`; a plain `uv run`
  # re-syncs (dev deps from PyPI, writes into the root-owned venv) -> fails under a random
  # restricted-v2 UID and needs PyPI egress. Use the baked venv as-is and a writable cache.
  extraEnv:
    - {name: UV_NO_SYNC, value: "1"}
    - {name: UV_CACHE_DIR, value: /tmp/uv-cache}
    - {name: HOME, value: /tmp}
  deployments:
    api:
      service: {type: ClusterIP, port: 8000}
      resources:
        requests: {cpu: 500m, memory: 1Gi, ephemeral-storage: 2Gi}
        limits:   {cpu: "2",  memory: 2Gi, ephemeral-storage: 10Gi}
    celeryWorker:
      resources:
        requests: {cpu: "1", memory: 4Gi, ephemeral-storage: 2Gi}
        limits:   {cpu: "4", memory: 8Gi, ephemeral-storage: 10Gi}
      # upstream --concurrency=50 (50 processes, ~10-20Gi). One job needs a handful of slots.
      command: [uv, run, celery, -A, "src.tasks.cli:celery_app", worker, --loglevel=info,
                --concurrency=8, --queues=celery, -n, "main_worker@%h", --purge]
    celeryParentWorker:
      resources:
        requests: {cpu: 250m, memory: 1Gi, ephemeral-storage: 1Gi}
        limits:   {cpu: "1",  memory: 2Gi, ephemeral-storage: 5Gi}
    mlflow: {service: {type: ClusterIP, port: 5000}}
    flower: {service: {type: ClusterIP, port: 5555}}
  # Mounted as /legal/source/config/config.yaml (replaces the image's config)
  config:
    nmp_config:
      nemo_base_url: "http://nemo-gateway"            # in-cluster router (templates/nemo-gateway.yaml)
      nim_base_url: "http://nemo-nim-proxy:8000"
      datastore_base_url: "http://nemo-data-store:3000"
      nmp_namespace: "dfwbp"
    logging_config: {level: "INFO"}
    mlflow_config:
      tracking_uri: "http://df-mlflow-service:5000"
      experiment_name_prefix: "data-flywheel"
      artifact_location: "./mlruns"

    # Judge: LOCAL meta/llama-3.1-8b-instruct NIM, 1 GPU (deployed by NeMo deployment-management).
    llm_judge_config:
      deployment_type: "local"
      model_name: "meta/llama-3.1-8b-instruct"
      context_length: 32768
      gpus: 1
      pvc_size: 25Gi
      tag: "1.8.3"            # same tag NVIDIA uses for this model in flywheel v0.3.1 config.yaml; 1x L40S TP1 profiles listed for NIM 1.8

    nims:
      - model_name: "meta/llama-3.2-1b-instruct"
        model_type: "llm"
        context_length: 8192
        gpus: 1
        pvc_size: 25Gi
        tag: "1.8.3"            # verified published on nvcr.io (2026-11-19)
        customization_enabled: true
        customizer_configs:
          target: "meta/llama-3.2-1b-instruct@2.0"
          gpus: 1
          max_seq_length: 8192

    data_split_config:
      eval_size: 100
      val_ratio: 0.1
      min_total_records: 50
      random_seed: null
      limit: 1000
      parse_function_arguments: true

    # uniform_distribution => no embedding NIM (saves 1 GPU). Upstream default is semantic_similarity.
    icl_config:
      max_context_length: 32768
      reserved_tokens: 4096
      max_examples: 3
      min_examples: 1
      example_selection: "uniform_distribution"

    training_config:
      training_type: "sft"
      finetuning_type: "lora"
      epochs: 2
      batch_size: 16
      learning_rate: 0.0001
    lora_config:
      adapter_dim: 32
      adapter_dropout: 0.1

# =============================================================================
# NeMo Microservices 25.8.0 (subchart)
# =============================================================================
nemo-microservices-helm-chart:
  enabled: true
  existingSecret: ngc-api                      # NGC key for model downloads (pre-created)
  existingImagePullSecret: ngc-registry-default
  imagePullSecrets: []
  global:
    imagePullSecrets:
      - name: ngc-registry-default
    security:
      allowInsecureImages: true                # needed for the bitnamilegacy images below

  # ---- not needed by the flywheel: off ----
  guardrails: {enabled: false}
  auditor: {enabled: false}
  ingress: {enabled: false}
  virtualService: {enabled: false}
  dgxc-admission-controller: {enabled: false}
  volcano: {enabled: false}                    # installed separately, cluster-scoped (approval)

  # Bundled NIM Operator v2.0.2: not used. One NIM Operator (already on the cluster, or the
  # v3.0.2 installed in RUNBOOK 0.4) serves both blueprints.
  nim-operator:
    enabled: false

  # ---- NeMo Operator: watch only this namespace (Role instead of ClusterRole) ----
  nemo-operator:
    restrictedNamespace: nvaie-test            # CONFIG: namespace
    controllerManager:
      kubeRbacProxy:
        enabled: false                         # PATCH key: metrics-only sidecar; its image gcr.io/kubebuilder/kube-rbac-proxy:v0.15.0 is gone (404)
    imagePullSecrets:
      - name: ngc-registry-default
    metricsService: {enabled: false}

  # ---- Deployment management: creates the candidate + judge NIMs as NIMService CRs ----
  deployment-management:
    nimNamespace: nvaie-test                   # CONFIG: namespace (Role instead of ClusterRole)
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits:   {cpu: "1",  memory: 1Gi}
    deployments:
      defaultStorageClass: ocs-storagecluster-ceph-rbd   # CONFIG: StorageClass for NIM model caches
      nimPvcSize: 25Gi
      modelPullerPullSecret: ngc-registry-default
      nimImagePullSecrets:
        - ngc-registry-default

  nim-proxy:
    nimNamespace: nvaie-test                   # CONFIG: namespace
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits:   {cpu: "1",  memory: 1Gi}

  # ---- Data store (Gitea-based, HF-compatible) ----
  data-store:
    configureDatastoreForceUid1000: false      # PATCH key: no forced UID 1000 / fsGroup 1000 (restricted-v2 assigns them)
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits:   {cpu: "1",  memory: 2Gi}
    initContainers:
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits:   {cpu: 500m, memory: 512Mi}
    external:
      rootUrl: http://nemo-data-store:3000     # in-cluster; upstream used fake host data-store.test
      domain: nemo-data-store
    persistence:
      size: 5Gi
      storageClass: ocs-storagecluster-ceph-rbd   # CONFIG
    postgresql-ha: {enabled: false}
    postgresql:
      image: {repository: bitnamilegacy/postgresql}
      primary:
        podSecurityContext: {enabled: false}
        containerSecurityContext: {enabled: false}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits:   {cpu: "1",  memory: 1Gi}
        persistence: {size: 2Gi, storageClass: ocs-storagecluster-ceph-rbd}   # CONFIG
      global: {storageClass: ocs-storagecluster-ceph-rbd}   # CONFIG

  entity-store:
    waitForPostgres:
      usePythonFromMainImage: true             # PATCH key: no busybox:latest
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits:   {cpu: 200m, memory: 256Mi}
    dbMigration:
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits:   {cpu: "1",  memory: 1Gi}
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits:   {cpu: "1",  memory: 1Gi}
    postgresql:
      image: {repository: bitnamilegacy/postgresql}
      primary:
        podSecurityContext: {enabled: false}
        containerSecurityContext: {enabled: false}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits:   {cpu: "1",  memory: 1Gi}
        persistence: {size: 2Gi, storageClass: ocs-storagecluster-ceph-rbd}   # CONFIG
      global: {storageClass: ocs-storagecluster-ceph-rbd}   # CONFIG

  evaluator:
    waitForPostgres:
      image: "nvcr.io/nvidia/nemo-microservices/entity-store:25.08"   # PATCH key: python TCP wait, no busybox:latest
      resources:
        requests: {cpu: 50m, memory: 64Mi}
        limits:   {cpu: 200m, memory: 256Mi}
    dbMigration:
      securityContext: {}                      # PATCH key: upstream forces runAsUser 0 (root)
    evalJobResources:                          # PATCH key: runtime eval Job (upstream: none)
      requests: {cpu: 500m, memory: 1Gi}
      limits:   {cpu: "2",  memory: 4Gi}
    evalJobResultsHandlerResources:
      requests: {cpu: 100m, memory: 256Mi}
      limits:   {cpu: 500m, memory: 1Gi}
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits:   {cpu: "1",  memory: 1Gi}
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits:   {cpu: "2",  memory: 4Gi}
    postgresql:
      image: {repository: bitnamilegacy/postgresql}
      primary:
        podSecurityContext: {enabled: false}
        containerSecurityContext: {enabled: false}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits:   {cpu: "1",  memory: 1Gi}
        persistence: {size: 2Gi, storageClass: ocs-storagecluster-ceph-rbd}   # CONFIG
      global: {storageClass: ocs-storagecluster-ceph-rbd, size: 2Gi}   # CONFIG

  customizer:
    enabled: true
    apiResources:                              # PATCH key (upstream sets no resources)
      requests: {cpu: 250m, memory: 512Mi}
      limits:   {cpu: "2",  memory: 2Gi}
    modelDownloader:
      restrictedV2: true                       # PATCH key: drop upstream fixed UID/GID/fsGroup 1000 (rejected by restricted-v2)
    modelsStorage:
      storageClassName: ocs-storagecluster-ceph-rbd   # CONFIG
      size: 30Gi                               # only the 1B checkpoint is downloaded
      accessModes: [ReadWriteOnce]
    customizationTargets:
      overrideExistingTargets: true
      targets:                                 # only the 1B candidate (upstream also enables 3B and 8B downloads)
        meta/llama-3.2-1b-instruct@2.0: {enabled: true}
        meta/llama-3.2-3b-instruct@2.0: {enabled: false}
        meta/llama-3.1-8b-instruct@2.0: {enabled: false}
    customizerConfig:
      training:
        queue: "default"                       # Volcano queue (Volcano's own "default" Queue, not Kueue)
        pvc:
          storageClass: ocs-storagecluster-ceph-rbd   # CONFIG
          volumeAccessMode: "ReadWriteOnce"
          size: 10Gi
      openTelemetry: {enabled: false}
      tolerations: []
      nodeSelectors: {}                        # set by the layout file
    opentelemetry-collector: {enabled: false}
    postgresql:
      image: {repository: bitnamilegacy/postgresql}
      primary:
        podSecurityContext: {enabled: false}
        containerSecurityContext: {enabled: false}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits:   {cpu: "1",  memory: 1Gi}
        persistence: {size: 2Gi, storageClass: ocs-storagecluster-ceph-rbd}   # CONFIG
      global: {storageClass: ocs-storagecluster-ceph-rbd}   # CONFIG
