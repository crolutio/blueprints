# Flywheel layout: FALLBACK (likely) - all 3 GPUs on L40S (48 GB).
#   Customizer LoRA training pod -> pinned to L40S by this file.
#   Candidate 1B NIM + 8B judge NIM -> any free GPU (deployment-management cannot set a
#   nodeSelector; see RUNBOOK "NIM placement").
# Feasibility: NeMo 25.8 ships an L40 customization profile for this exact target
# (meta/llama-3.2-1b-instruct@v1.0.0+L40: sft/lora, 1 GPU, TP1, micro_batch 1), and the
# 1B NIM has L40S profiles. Expected to work; not tested on this cluster.
nemo-microservices-helm-chart:
  customizer:
    customizerConfig:
      nodeSelectors:
        nvidia.com/gpu.product: NVIDIA-L40S    # CONFIG
