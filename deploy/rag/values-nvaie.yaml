# =============================================================================
# NVIDIA RAG Blueprint v2.6.2 (chart v2.6.0) - nvaie-test overrides, barebones, text-only
#
# Layer order (as in NVIDIA's OpenShift Helm guide, plus this file last):
#   helm upgrade --install rag chart -n nvaie-test \
#     -f chart/values-openshift.yaml -f values-nvaie.yaml
#
# GPUs: 2 x L40S
#   1 x LLM NIM        meta/llama-3.1-8b-instruct          (NIMService nim-llm)
#   1 x Embedding NIM  nvidia/llama-nemotron-embed-1b-v2   (NIMService nemotron-embedding-ms)
# Disabled: reranker, VLM embedder/reranker/VLM/captioning, all nv-ingest extraction NIMs
# (page elements, graphic elements, table structure, OCR, nemotron-parse, audio),
# Milvus, frontend, Routes, observability, ECK operator.
#
# CONFIG items: namespace (helm -n), StorageClass, Kueue label, nodeSelectors.
# Requires on the cluster: the NVIDIA NIM Operator (already installed by the client).
# Creates NO cluster-scoped objects. Elasticsearch is a plain Deployment in the namespace.
# OpenShift: NOTHING runs as root. Every pod runs under restricted-v2 (random UID), the NIM pods
# under nonroot (UID 1000, set by the NIM Operator). nv-ingest uses our non-root rebuild of NVIDIA's
# image (deploy/images/nv-ingest-nonroot), because NVIDIA's 26.3.0 image can only run as root.
# =============================================================================

# CONFIG: Kueue LocalQueue label ("" = off). Applies to rag-server, ingestor-server, NIM pods.
kueue:
  queueName: ""

# --- OpenShift: no anyuid (NVIDIA's chart grants it to 7 service accounts), no external Routes.
openshift:
  enabled: true
  anyuidRoleBinding: false      # PATCH key: no anyuid RoleBinding at all -> nothing can run as root
  routes:
    frontend: {enabled: false}
    ragServer: {enabled: false} # validation is done in-cluster (oc exec / port-forward)

# --- Secrets are pre-created by the runbook ---
imagePullSecret:
  name: ngc-registry-default
  create: false
ngcApiSecret:
  name: ngc-api                 # key NGC_API_KEY
  create: false

nodeSelector: {}                # CONFIG: rag-server placement (CPU)

resources:
  requests: {cpu: 500m, memory: 2Gi}
  limits:   {cpu: "4",  memory: 8Gi}
server:
  workers: 4

envVars:
  # LLM: llama-3.1-8b-instruct (not a reasoning model -> thinking off)
  APP_LLM_MODELNAME: "meta/llama-3.1-8b-instruct"
  APP_LLM_SERVERURL: "nim-llm:8000"
  LLM_MAX_TOKENS: "1024"
  LLM_ENABLE_THINKING: "false"
  LLM_LOW_EFFORT: "false"
  APP_QUERYREWRITER_MODELNAME: "meta/llama-3.1-8b-instruct"
  APP_FILTEREXPRESSIONGENERATOR_MODELNAME: "meta/llama-3.1-8b-instruct"
  REFLECTION_LLM: "meta/llama-3.1-8b-instruct"
  # Text embedder (VL embedder disabled)
  APP_EMBEDDINGS_SERVERURL: "nemotron-embedding-ms:8000/v1"
  APP_EMBEDDINGS_MODELNAME: "nvidia/llama-nemotron-embed-1b-v2"
  APP_EMBEDDINGS_DIMENSIONS: "2048"
  # No reranker
  ENABLE_RERANKER: "False"
  APP_RANKING_SERVERURL: ""
  ENABLE_GUARDRAILS: "False"
  # Vector DB: plain Elasticsearch (templates/elasticsearch.yaml), not ECK
  APP_VECTORSTORE_URL: "http://rag-elasticsearch:9200"
  # Writable temp dir. The default "./tmp-data" is under /workspace (root-only); without anyuid
  # rag-server runs with a random UID and every knowledge-base query fails with
  # "Permission denied: './tmp-data'". /tmp-data is world-writable in the image (ingestor-server
  # already uses it).
  TEMP_DIR: "/tmp-data"

# --- Ingestor server: text-only extraction ---
ingestor-server:
  imagePullSecret:
    name: ngc-registry-default
    create: false
  nodeSelector: {}              # CONFIG
  resources:
    requests: {cpu: 500m, memory: 2Gi}
    limits:   {cpu: "4",  memory: 8Gi}
  envVars:
    APP_EMBEDDINGS_SERVERURL: "nemotron-embedding-ms:8000/v1"
    APP_EMBEDDINGS_MODELNAME: "nvidia/llama-nemotron-embed-1b-v2"
    APP_EMBEDDINGS_DIMENSIONS: "2048"
    APP_NVINGEST_EXTRACTTEXT: "True"
    APP_NVINGEST_EXTRACTTABLES: "False"
    APP_NVINGEST_EXTRACTCHARTS: "False"
    APP_NVINGEST_EXTRACTINFOGRAPHICS: "False"
    APP_NVINGEST_EXTRACTIMAGES: "False"
    SUMMARY_LLM: "meta/llama-3.1-8b-instruct"
    APP_VECTORSTORE_URL: "http://rag-elasticsearch:9200"
  persistence:
    storageClass: ocs-storagecluster-ceph-rbd   # CONFIG
    size: 5Gi

frontend:
  enabled: false

# --- SeaweedFS (S3 object store used by nv-ingest / ingestor) ---
seaweedfs:
  image: {repository: docker.io/chrislusf/seaweedfs, tag: "3.73"}   # fully qualified: short names resolve to the client's Artifactory (unauthorized)
  allInOne:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits:   {cpu: "1",  memory: 1Gi}
    data:
      type: "persistentVolumeClaim"
      storageClass: ocs-storagecluster-ceph-rbd # CONFIG
      size: 5Gi

# --- Elasticsearch vector DB: plain single-node Deployment, CPU only (no ECK operator/CRDs) ---
# Same settings as NVIDIA's Docker Compose deployment of this blueprint. Runs under
# restricted-v2 (random UID, group 0); the PVC is made writable through the pod fsGroup.
eck-elasticsearch:
  enabled: false
elasticsearch:                  # PATCH key (templates/elasticsearch.yaml)
  enabled: true
  image: docker.io/library/elasticsearch:9.3.0   # docker.elastic.co is blocked on the client cluster; same release from Docker Hub
  javaOpts: "-Xms1g -Xmx1g"
  resources:
    requests: {cpu: 500m, memory: 2Gi}
    limits:   {cpu: "2",  memory: 2Gi}
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: ["ALL"]}
  nodeSelector: {}              # CONFIG
  persistence:
    enabled: true
    storageClass: ocs-storagecluster-ceph-rbd   # CONFIG
    size: 5Gi

# --- NIMs (NIM Operator) ---
nimOperator:
  nim-llm:
    enabled: true
    image:
      repository: nvcr.io/nim/meta/llama-3.1-8b-instruct
      tag: "1.8.3"            # same tag as the flywheel judge (one image for both); 1x L40S TP1 profiles listed for NIM 1.8
      pullPolicy: IfNotPresent
    resources:
      requests: {nvidia.com/gpu: 1, cpu: "2", memory: 24Gi}
      limits:   {nvidia.com/gpu: 1, cpu: "8", memory: 48Gi}
    cacheResources: {cpu: "1", memory: 4Gi}   # PATCH key: NIMCache download job
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-L40S      # CONFIG
    tolerations: []
    # Profile filter for the NIMCache download. Every key is set on purpose: the chart's defaults
    # (engine vllm, precision fp8) would otherwise be merged in, and NVIDIA's 1.8.3 manifest has no
    # vLLM fp8 L40S profile ("no profiles are selected for caching"). Checked against the real
    # manifest with NIM Operator 3.1.2: selects exactly 1 profile, ad17776f... (L40S, TP1, fp8,
    # TensorRT-LLM, throughput).
    model:
      engine: tensorrt_llm
      precision: fp8
      tensorParallelism: "1"
      lora: false
      gpus:
      - product: "l40s"
    storage:
      pvc:
        create: true
        size: "50Gi"
        volumeAccessMode: ReadWriteOnce
        storageClass: ocs-storagecluster-ceph-rbd   # CONFIG
      sharedMemorySizeLimit: "2Gi"
    env:
      - name: NIM_HTTP_API_PORT
        value: "8000"
      - name: NIM_SERVED_MODEL_NAME
        value: "meta/llama-3.1-8b-instruct"

  nvidia-nim-llama-nemotron-embed-1b-v2:
    enabled: true
    # PATCH key: cache only the L40S profile (compute capability 8.9, fp16, TensorRT). Without it the
    # operator downloads all 11 profiles of NIM 1.13.0 (~20 GB, more than the 20Gi volume).
    model:
      profiles: ["b313b88dbb2e4bf4fe60311a612e6216fe106be02375baa2e1d21cf8e24e5809"]
    resources:
      requests: {nvidia.com/gpu: 1, cpu: "1", memory: 8Gi}
      limits:   {nvidia.com/gpu: 1, cpu: "4", memory: 16Gi}
    cacheResources: {cpu: "1", memory: 2Gi}   # PATCH key: NIMCache download job
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-L40S      # CONFIG
    storage:
      pvc:
        create: true
        size: "20Gi"
        volumeAccessMode: ReadWriteOnce
        storageClass: ocs-storagecluster-ceph-rbd   # CONFIG

  nvidia-nim-llama-nemotron-embed-vl-1b-v2: {enabled: false}
  nvidia-nim-llama-nemotron-rerank-1b-v2:   {enabled: false}
  nvidia-nim-llama-nemotron-rerank-vl-1b-v2: {enabled: false}
  nim-vlm: {enabled: false}
  nim-vlm-captioning: {enabled: false}

# --- nv-ingest: text extraction only, no extraction NIMs ---
nv-ingest:
  # CONFIG: our non-root build of nv-ingest 26.3.0 (deploy/images/nv-ingest-nonroot, runbook 2.0).
  # Default = built inside the namespace with an OpenShift build into the internal registry.
  image:
    repository: image-registry.openshift-image-registry.svc:5000/nvaie-test/nv-ingest-nonroot
    tag: "26.3.0"
    pullPolicy: Always
  # NVIDIA's OpenShift overlay keeps the chart's fixed fsGroup 1000, which restricted-v2 rejects:
  # remove it so OpenShift assigns one from the namespace range.
  podSecurityContext:
    fsGroup: null
  imagePullSecrets:
    - name: ngc-registry-default
  podLabels: {}                 # add kueue.x-k8s.io/queue-name here if Kueue is required
  # ~125 Python processes (32 gunicorn API workers hard-coded in the image entrypoint + ~50 Ray
  # workers). NVIDIA's default is a 24Gi request with NO limit; near the limit Ray kills its own
  # workers and ingestion hangs in PENDING. Request = NVIDIA's 24Gi, limit 32Gi for headroom.
  resources:
    requests: {cpu: "2", memory: 24Gi}
    limits:   {cpu: "8", memory: 32Gi}
  envVars:
    COMPONENTS_TO_READY_CHECK: ""          # do not wait for the disabled extraction NIMs
    INSTALL_AUDIO_EXTRACTION_DEPS: "false" # avoid runtime package downloads
    APP_EMBEDDINGS_SERVERURL: "nemotron-embedding-ms:8000/v1"
    APP_EMBEDDINGS_MODELNAME: "nvidia/llama-nemotron-embed-1b-v2"
    EMBEDDING_NIM_ENDPOINT: "http://nemotron-embedding-ms:8000/v1"
    EMBEDDING_NIM_MODEL_NAME: "nvidia/llama-nemotron-embed-1b-v2"
  milvusDeployed: false
  redis:
    architecture: standalone    # upstream: master + 1 replica
    master:
      persistence: {enabled: false}       # queue only, ephemeral is fine for this test
      podSecurityContext: {enabled: false}        # upstream fixed UID/fsGroup 1001 -> let restricted-v2 assign
      containerSecurityContext: {enabled: false}
      resources:
        requests: {cpu: 100m, memory: 256Mi}
        limits:   {cpu: "1",  memory: 1Gi}
  nimOperator:
    embedqa: {enabled: false}
    ocr: {enabled: false}
    graphic_elements: {enabled: false}
    page_elements: {enabled: false}
    table_structure: {enabled: false}
    nemotron_parse: {enabled: false}
    audio: {enabled: false}
